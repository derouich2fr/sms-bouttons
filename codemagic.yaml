workflows:
  android-debug:
    name: SMS Boutons Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Extract Android project
        script: |
          base64 --decode project.zip.b64 > project.zip
          unzip -o project.zip
          cp -R SMSBoutons/. .
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Install Gradle 8.7
        script: |
          curl -fL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build debug APK
        script: |
          /tmp/gradle-8.7/bin/gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
